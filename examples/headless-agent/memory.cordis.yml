# Add curated cross-session markdown memory and its model-facing tools to the real one-shot app.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: memory-markdown
            name: '@deepseek-ai/dsh-memory-markdown'
            config:
              workspace: !!js process.cwd()
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
